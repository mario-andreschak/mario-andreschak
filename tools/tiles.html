<!doctype html>
<meta charset="utf-8">
<title>profile tiles</title>
<style>
  @font-face { font-family: 'Geist'; src: url('node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'Geist Mono'; src: url('node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }

  html, body { margin: 0; background: transparent; }
  * { box-sizing: border-box; }
  #stage { display: inline-block; }

  .dark  { --bg:#0d0f20; --card:#13162c; --well:#0a0c1a; --ink:#f1f2ff; --soft:#a3a8cc; --faint:#6b7099; --line:#2b3052; --violet:#9a8dff; --cyan:#3fdcef; --pink:#ff7ab6; --amber:#ffc266; --green:#5fe0a0; }
  .light { --bg:#f5f4ff; --card:#ffffff; --well:#eeecfb; --ink:#17173b; --soft:#565a83; --faint:#8a8db0; --line:#d9d6f2; --violet:#4d43d6; --cyan:#0a8ba1; --pink:#d43a85; --amber:#c47a0c; --green:#12915a; }

  .t { font-family: 'Geist', sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  .mono { font-family: 'Geist Mono', monospace; }

  /* Project cards: a picture on top, name and one sentence below. */
  .card { position: relative; width: 840px; background: var(--card); border: 2px solid var(--line); border-radius: 30px; overflow: hidden; display: flex; flex-direction: column; }
  .small { height: 525px; }
  .tall  { height: 1076px; }
  .pic { flex: 1; min-height: 0; position: relative; background: var(--well); border-bottom: 2px solid var(--line); overflow: hidden; }
  .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pic svg { width: 100%; height: 100%; display: block; }
  .foot { padding: 24px 36px 26px; }
  .small .foot { height: 182px; }
  .tall .foot { height: 296px; padding: 36px 44px; }
  .name { display: flex; align-items: center; gap: 16px; font-weight: 650; letter-spacing: -.03em; line-height: 1; }
  .small .name { font-size: 44px; }
  .tall .name { font-size: 84px; letter-spacing: -.045em; gap: 24px; }
  .dot { flex: none; border-radius: 50%; border: 5px solid var(--violet); background: var(--card); box-shadow: 0 0 0 5px color-mix(in srgb, var(--cyan) 28%, transparent); }
  .small .dot { width: 22px; height: 22px; }
  .tall .dot { width: 34px; height: 34px; border-width: 8px; }
  .line { color: var(--soft); font-weight: 450; }
  .small .line { margin-top: 14px; font-size: 28px; line-height: 1.28; }
  .tall .line { margin-top: 24px; font-size: 36px; line-height: 1.3; }

  /* Row of three: narrower, so type and art scale up to stay readable. */
  .third { width: 840px; height: 640px; }
  .third .foot { height: 262px; padding: 30px 38px; }
  .third .name { font-size: 46px; }
  .third .dot { width: 24px; height: 24px; }
  .third .line { margin-top: 18px; font-size: 38px; line-height: 1.24; }

  /* Full-width card over a picture. */
  .wide { width: 1760px; height: 640px; position: relative; border-radius: 30px; overflow: hidden; border: 2px solid var(--line); background: #000; }
  .wide img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .wide .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(8,9,22,.94) 0%, rgba(8,9,22,.82) 38%, rgba(8,9,22,0) 72%); }
  .wide .text { position: absolute; left: 60px; bottom: 56px; width: 800px; color: #f1f2ff; }
  .wide h3 { margin: 0; font-size: 92px; letter-spacing: -.045em; line-height: 1; font-weight: 650; }
  .wide p { margin: 26px 0 0; font-size: 38px; line-height: 1.28; color: #cdd0ee; }
  .wide small { display: block; margin-top: 22px; font-size: 24px; color: #9095bb; }

  /* Section title: a wire with a node on it, like a step in a flow. */
  .section { width: 1760px; height: 190px; position: relative; }
  .section .node { position: absolute; left: 0; top: 34px; width: 96px; height: 96px; border-radius: 28px; display: grid; place-items: center; font: 600 36px 'Geist Mono'; color: #fff; background: linear-gradient(145deg, #8b7cff, #4d43d6); }
  .section h2 { position: absolute; left: 128px; top: 30px; margin: 0; font-size: 72px; letter-spacing: -.04em; font-weight: 650; line-height: 1.3; white-space: nowrap; }
  .section .say { position: absolute; right: 0; top: 56px; font-size: 34px; font-weight: 450; color: var(--soft); white-space: nowrap; }
  .section .wire { position: absolute; left: 48px; right: 0; top: 166px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--violet), var(--cyan) 45%, var(--line) 100%); }
  .section .wire:after { content: ''; position: absolute; right: -2px; top: -9px; width: 22px; height: 22px; border-radius: 50%; border: 5px solid var(--line); background: var(--bg); }

  /* Banner */
  .header { width: 1760px; height: 660px; position: relative; border-radius: 36px; overflow: hidden; background: var(--bg); border: 2px solid var(--line); }
  .header .glow { position: absolute; left: -240px; bottom: -340px; width: 1100px; height: 800px; border-radius: 50%; background: radial-gradient(closest-side, color-mix(in srgb, var(--violet) 26%, transparent), transparent); }
  .header .copy { position: absolute; left: 72px; top: 92px; width: 800px; }
  .header .logo { width: 104px; height: 104px; display: block; }
  .header h1 { margin: 0; font-size: 122px; letter-spacing: -.055em; line-height: 1.02; font-weight: 680; white-space: pre-line; }
  .header .big { margin-top: 26px; font-size: 46px; line-height: 1.2; letter-spacing: -.02em; font-weight: 550; }
  .header .sub { margin-top: 22px; font-size: 32px; line-height: 1.34; color: var(--soft); }
  .header svg.graph { position: absolute; right: 0; top: 0; width: 900px; height: 660px; }
</style>
<div id="stage"></div>
<script>
const LOGO = `<svg class="logo" viewBox="0 0 64 64"><defs><linearGradient id="lg" x1="7" y1="5" x2="58" y2="61" gradientUnits="userSpaceOnUse"><stop stop-color="#8B7CFF"/><stop offset="1" stop-color="#4D43D6"/></linearGradient></defs><rect width="64" height="64" rx="18" fill="url(#lg)"/><circle cx="50" cy="13" r="15" fill="#32D5EA" opacity=".2"/><path d="M20 17h27v8H29v7h15v8H29v12h-9V17Z" fill="#fff"/></svg>`;

// Banner graph: what feeds FLUJO on the left, what runs on it on the right.
function graph(g) {
  const L = [[120,190],[120,470]], R = [[735,110],[735,330],[735,550]], C = [420,330];
  const box = ([x, y], label, w = 236) => `<g><rect x="${x-w/2}" y="${y-44}" width="${w}" height="88" rx="24" fill="var(--card)" stroke="var(--line)" stroke-width="2.5"/><text x="${x}" y="${y+11}" text-anchor="middle" font-size="32" font-weight="600" fill="var(--ink)">${label}</text></g>`;
  const wire = (a, b, c = 'var(--violet)') => { const [x1,y1]=a,[x2,y2]=b, m=(x1+x2)/2; return `<path d="M${x1} ${y1} C${m} ${y1} ${m} ${y2} ${x2} ${y2}" fill="none" stroke="${c}" stroke-width="4" stroke-linecap="round"/>`; };
  const pulse = (x, y, c = 'var(--cyan)') => `<circle cx="${x}" cy="${y}" r="20" fill="${c}" opacity=".2"/><circle cx="${x}" cy="${y}" r="9" fill="${c}"/>`;
  return `<svg class="graph" viewBox="0 0 900 660">
    ${L.map(p=>wire([p[0]+118,p[1]],[C[0]-90,C[1]])).join('')}
    ${R.map(p=>wire([C[0]+90,C[1]],[p[0]-118,p[1]],'var(--cyan)')).join('')}
    ${pulse(284,260)}${pulse(284,400)}${pulse(563,220,'var(--violet)')}${pulse(563,330,'var(--violet)')}${pulse(563,440,'var(--violet)')}
    ${L.map((p,i)=>box(p,g.left[i])).join('')}
    <g><rect x="326" y="246" width="188" height="168" rx="38" fill="url(#fg)"/><text x="420" y="352" text-anchor="middle" font-size="64" font-weight="700" fill="#fff" letter-spacing="-1">${g.center}</text></g>
    ${R.map((p,i)=>box(p,g.right[i])).join('')}
    <defs><linearGradient id="fg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8B7CFF"/><stop offset="1" stop-color="#4D43D6"/></linearGradient></defs>
  </svg>`;
}

const ART = {
  // FACTORY: a mission goes down the line, gets split across workers, gets checked.
  factory: () => {
    const st = (x, label, inner) => `<rect x="${x}" y="72" width="200" height="176" rx="20" fill="var(--card)" stroke="var(--line)" stroke-width="2.5"/>${inner}<text x="${x+100}" y="296" text-anchor="middle" font-size="27" font-weight="550" fill="var(--soft)">${label}</text>`;
    let dots = ''; for (let r=0;r<3;r++) for (let c=0;c<4;c++) dots += `<circle cx="${328+c*36}" cy="${124+r*36}" r="11" fill="${(r*4+c)%5===0?'var(--cyan)':'var(--violet)'}"/>`;
    return `<svg viewBox="0 0 840 343" preserveAspectRatio="xMidYMid slice">
      <path d="M0 160 H840" stroke="var(--line)" stroke-width="6" stroke-dasharray="2 18" stroke-linecap="round"/>
      ${st(44,'Mission',`<rect x="94" y="112" width="100" height="96" rx="10" fill="none" stroke="var(--violet)" stroke-width="5"/><path d="M112 140h64M112 160h64M112 180h38" stroke="var(--violet)" stroke-width="5" stroke-linecap="round"/>`)}
      ${st(320-20,'Workers',dots)}
      ${st(596,'Checked',`<circle cx="696" cy="160" r="52" fill="none" stroke="var(--green)" stroke-width="6"/><path d="M672 161l17 18 34-38" fill="none" stroke="var(--green)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>`)}
      <path d="M254 160h36m-12-11 12 11-12 11M510 160h76m-12-11 12 11-12 11" fill="none" stroke="var(--cyan)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;
  },
  // flujo-cloud: the CLI flow, taken from the project's own instructions.
  cloud: () => {
    const rows = [['flujo-cloud','preflight --flow FLUJO'],['flujo-cloud','up --flow FLUJO'],['flujo-cloud','call WORKER --prompt "…"'],['flujo-cloud','down WORKER']];
    return `<svg viewBox="0 0 840 343" preserveAspectRatio="xMidYMid slice">
      <rect x="44" y="34" width="752" height="276" rx="20" fill="var(--card)" stroke="var(--line)" stroke-width="2.5"/>
      <circle cx="80" cy="70" r="9" fill="var(--pink)"/><circle cx="110" cy="70" r="9" fill="var(--amber)"/><circle cx="140" cy="70" r="9" fill="var(--green)"/>
      ${rows.map((r,i)=>`<text class="mono" x="76" y="${132+i*48}" font-size="30" font-family="Geist Mono"><tspan fill="var(--cyan)">$ </tspan><tspan fill="var(--violet)" font-weight="600">${r[0]} </tspan><tspan fill="var(--ink)">${r[1]}</tspan></text>`).join('')}
    </svg>`;
  },
  // VS Code: one file, two cursors, one of them the AI's.
  editor: () => {
    const bar=(x,y,w,c)=>`<rect x="${x}" y="${y}" width="${w}" height="16" rx="8" fill="${c}"/>`;
    const tag=(x,y,label,c)=>`<path d="M${x} ${y-30}V${y+26}" stroke="${c}" stroke-width="5" stroke-linecap="round"/><rect x="${x}" y="${y-72}" width="${label.length*19+30}" height="44" rx="10" fill="${c}"/><text x="${x+15}" y="${y-41}" font-size="28" font-weight="600" fill="#fff">${label}</text>`;
    return `<svg viewBox="0 0 840 343" preserveAspectRatio="xMidYMid slice">
      <rect x="44" y="30" width="752" height="284" rx="16" fill="var(--card)" stroke="var(--line)" stroke-width="2.5"/>
      <path d="M226 30V314" stroke="var(--line)" stroke-width="2.5"/>
      ${bar(72,66,120,'var(--faint)')}${bar(90,106,96,'var(--line)')}${bar(90,146,110,'var(--line)')}${bar(90,186,84,'var(--line)')}${bar(90,226,100,'var(--line)')}
      ${bar(262,110,170,'var(--violet)')}${bar(446,110,120,'var(--ink)')}
      ${bar(292,160,130,'var(--cyan)')}${bar(436,160,210,'var(--faint)')}
      ${bar(292,210,240,'var(--faint)')}${bar(546,210,90,'var(--green)')}
      ${bar(262,260,120,'var(--violet)')}
      ${tag(590,124,'You','var(--violet)')}${tag(400,274,'AI','#0a8ba1')}
    </svg>`;
  },
  // ABAP API: the toolbox.
  abapapi: () => {
    const names=['Create','Change','Activate','Debug','Transport','Refactor','Query','Git'];
    const chip=(n,i)=>{const x=44+(i%4)*192,y=62+Math.floor(i/4)*134,c=i%3===0?'var(--cyan)':'var(--violet)';return `<rect x="${x}" y="${y}" width="176" height="112" rx="16" fill="var(--card)" stroke="${c}" stroke-width="3"/><text x="${x+88}" y="${y+68}" text-anchor="middle" font-size="30" font-weight="600" fill="var(--ink)">${n}</text>`;};
    return `<svg viewBox="0 0 840 378" preserveAspectRatio="xMidYMid slice">${names.map(chip).join('')}</svg>`;
  },
  // Chat: a conversation where the AI answers.
  chat: () => {
    const bubble=(x,y,w,mine,lines)=>`<rect x="${x}" y="${y}" width="${w}" height="${30+lines*30}" rx="22" fill="${mine?'color-mix(in srgb, var(--violet) 22%, var(--card))':'var(--card)'}" stroke="${mine?'var(--violet)':'var(--line)'}" stroke-width="2.5"/>`+Array.from({length:lines},(_,i)=>`<rect x="${x+24}" y="${y+24+i*30}" width="${w-48-(i===lines-1?60:0)}" height="12" rx="6" fill="${mine?'var(--violet)':'var(--faint)'}" opacity="${mine?.75:.6}"/>`).join('');
    return `<svg viewBox="0 0 840 378" preserveAspectRatio="xMidYMid slice">
      <rect x="230" y="20" width="380" height="420" rx="40" fill="var(--bg)" stroke="var(--line)" stroke-width="3"/>
      ${bubble(258,58,250,false,2)}${bubble(332,152,250,true,2)}${bubble(258,246,210,false,1)}
      <rect x="512" y="216" width="72" height="46" rx="12" fill="#0a8ba1"/><text x="548" y="249" text-anchor="middle" font-size="28" font-weight="600" fill="#fff">AI</text>
      <rect x="258" y="318" width="324" height="44" rx="22" fill="var(--card)" stroke="var(--line)" stroke-width="2.5"/>
    </svg>`;
  },
  // Word: a page being written.
  word: () => {
    const bar=(y,w,c='var(--line)')=>`<rect x="252" y="${y}" width="${w}" height="14" rx="7" fill="${c}"/>`;
    return `<svg viewBox="0 0 840 378" preserveAspectRatio="xMidYMid slice">
      <rect x="200" y="28" width="440" height="380" rx="10" fill="var(--card)" stroke="var(--line)" stroke-width="2.5"/>
      <rect x="252" y="70" width="230" height="30" rx="8" fill="var(--violet)"/>
      ${bar(130,336)}${bar(164,310)}${bar(198,330)}${bar(232,280)}${bar(280,336)}${bar(314,190,'var(--cyan)')}
      <path d="M452 304V336" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
      <rect x="470" y="288" width="72" height="46" rx="10" fill="#0a8ba1"/><text x="506" y="321" text-anchor="middle" font-size="28" font-weight="600" fill="#fff">AI</text>
    </svg>`;
  },
  // Essentials: a folder, a prompt and a screen grab.
  essentials: () => `<svg viewBox="0 0 840 378" preserveAspectRatio="xMidYMid slice">
      <path d="M60 110a14 14 0 0 1 14-14h66l26 28h86a14 14 0 0 1 14 14v124a14 14 0 0 1-14 14H74a14 14 0 0 1-14-14Z" fill="color-mix(in srgb, var(--violet) 20%, transparent)" stroke="var(--violet)" stroke-width="4"/>
      <text x="163" y="326" text-anchor="middle" font-size="30" font-weight="550" fill="var(--soft)">Files</text>
      <rect x="310" y="96" width="220" height="180" rx="16" fill="var(--card)" stroke="var(--line)" stroke-width="2.5"/>
      <text x="336" y="176" font-size="52" font-family="Geist Mono" font-weight="600" fill="var(--cyan)">&gt;_</text><rect x="336" y="208" width="150" height="12" rx="6" fill="var(--line)"/><rect x="336" y="234" width="100" height="12" rx="6" fill="var(--line)"/>
      <text x="420" y="326" text-anchor="middle" font-size="30" font-weight="550" fill="var(--soft)">Commands</text>
      <path d="M590 136V96h40M740 96h40v40M780 236v40h-40M630 276h-40v-40" fill="none" stroke="var(--pink)" stroke-width="6" stroke-linecap="round"/><circle cx="685" cy="186" r="34" fill="none" stroke="var(--pink)" stroke-width="5"/><circle cx="685" cy="186" r="12" fill="var(--pink)"/>
      <text x="685" y="326" text-anchor="middle" font-size="30" font-weight="550" fill="var(--soft)">Screen</text>
    </svg>`,
  // Image recognition: a picture with something found in it.
  image: () => `<svg viewBox="0 0 840 343" preserveAspectRatio="xMidYMid slice">
      <rect x="120" y="26" width="600" height="290" rx="16" fill="#1c2750"/>
      <circle cx="590" cy="104" r="42" fill="#ffc266"/>
      <path d="M120 300l150-160 96 92 74-70 280 138v2a14 14 0 0 1-14 14H134a14 14 0 0 1-14-14Z" fill="#5a4fcf"/>
      <path d="M120 316v-22l110-62 130 84Z" fill="#3fdcef" opacity=".55"/>
      <rect x="210" y="118" width="170" height="128" rx="8" fill="none" stroke="#3fdcef" stroke-width="5" stroke-dasharray="20 10"/>
      <rect x="210" y="74" width="170" height="44" rx="8" fill="#0a8ba1"/><text x="295" y="105" text-anchor="middle" font-size="28" font-weight="600" fill="#fff">mountain</text>
    </svg>`,
  // Video recognition: a film strip turning into sound and words.
  video2: () => {
    let film=''; for(let i=0;i<5;i++){const x=60+i*148;film+=`<rect x="${x}" y="30" width="128" height="104" rx="10" fill="color-mix(in srgb, ${i%2?'var(--cyan)':'var(--violet)'} 28%, var(--card))" stroke="var(--line)" stroke-width="2.5"/>`;}
    let wave=''; for(let i=0;i<58;i++){const x=64+i*12.6,h=8+Math.abs(Math.sin(i*.55)*Math.cos(i*.21))*58;wave+=`<rect x="${x}" y="${192-h/2}" width="7" height="${h}" rx="3.5" fill="var(--pink)"/>`;}
    return `<svg viewBox="0 0 840 343" preserveAspectRatio="xMidYMid slice">${film}${wave}<rect x="60" y="256" width="520" height="16" rx="8" fill="var(--faint)"/><rect x="60" y="290" width="350" height="16" rx="8" fill="var(--line)"/></svg>`;
  },
  // Game Boy project: a handheld with an original pixel scene.
  gameboy: () => {
    const P=['#0f380f','#306230','#8bac0f','#9bbc0f'], px=18, sx=222, sy=92; let scene=`<rect x="${sx}" y="${sy}" width="396" height="324" fill="${P[3]}"/>`;
    const cell=(c,r,k)=>{scene+=`<rect x="${sx+c*px}" y="${sy+r*px}" width="${px}" height="${px}" fill="${P[k]}"/>`;};
    for(let c=0;c<22;c++){cell(c,15,1);cell(c,16,0);cell(c,17,0);}
    [[3,4],[4,3],[5,3],[6,4],[4,4],[5,4],[15,6],[16,5],[17,5],[18,6],[16,6],[17,6]].forEach(([c,r])=>cell(c,r,2));
    [[17,14],[18,13],[18,14],[19,12],[19,13],[19,14],[20,13],[20,14]].forEach(([c,r])=>cell(c,r,1));
    const bot=['..0000..','.022220.','.020020.','.022220.','..0000..','.000000.','0.0000.0','..0..0..'];
    bot.forEach((row,r)=>[...row].forEach((ch,c)=>{ if(ch!=='.') cell(5+c,7+r,Number(ch)); }));
    return `<svg viewBox="0 0 840 780" preserveAspectRatio="xMidYMid slice">
      <rect x="130" y="24" width="580" height="732" rx="46" fill="var(--card)" stroke="var(--line)" stroke-width="3"/>
      <rect x="190" y="62" width="460" height="384" rx="22" fill="#2a2d4d"/>
      ${scene}
      <path d="M256 548h44v-44h56v44h44v56h-44v44h-56v-44h-44Z" fill="var(--violet)"/>
      <circle cx="510" cy="612" r="40" fill="var(--faint)"/>
      <circle cx="606" cy="548" r="40" fill="var(--cyan)"/><circle cx="606" cy="548" r="66" fill="none" stroke="var(--cyan)" stroke-width="4" opacity=".55"/><circle cx="606" cy="548" r="92" fill="none" stroke="var(--cyan)" stroke-width="3" opacity=".28"/>
      <rect x="640" y="430" width="90" height="56" rx="14" fill="#0a8ba1"/><text x="685" y="470" text-anchor="middle" font-size="34" font-weight="650" fill="#fff">AI</text>
      <rect x="318" y="690" width="84" height="20" rx="10" fill="var(--line)"/><rect x="438" y="690" width="84" height="20" rx="10" fill="var(--line)"/>
    </svg>`;
  },
  // CAD: a gear on blueprint paper with dimension lines.
  cad: () => {
    const cx=420, cy=212, teeth=14, ro=132, ri=104; let d='';
    for (let i=0;i<teeth;i++){ const a=i/teeth*2*Math.PI, s=Math.PI/teeth;
      const p=(r,t)=>`${(cx+r*Math.cos(t)).toFixed(1)} ${(cy+r*Math.sin(t)).toFixed(1)}`;
      d+=`${i?'L':'M'}${p(ri,a-s*.55)} L${p(ro,a-s*.32)} L${p(ro,a+s*.32)} L${p(ri,a+s*.55)} `; }
    let grid=''; for(let x=0;x<=840;x+=42) grid+=`<path d="M${x} 0V460" stroke="var(--line)" stroke-width="1"/>`; for(let y=0;y<=460;y+=42) grid+=`<path d="M0 ${y}H840" stroke="var(--line)" stroke-width="1"/>`;
    return `<svg viewBox="0 0 840 378" preserveAspectRatio="xMidYMid slice">${grid}
      <path d="${d}Z" fill="color-mix(in srgb, var(--violet) 16%, transparent)" stroke="var(--violet)" stroke-width="5" stroke-linejoin="round"/>
      <circle cx="${cx}" cy="${cy}" r="62" fill="var(--well)" stroke="var(--violet)" stroke-width="5"/><circle cx="${cx}" cy="${cy}" r="26" fill="none" stroke="var(--cyan)" stroke-width="5"/>
      <path d="M${cx-210} ${cy}H${cx+210}M${cx} ${cy-180}V${cy+180}" stroke="var(--cyan)" stroke-width="2.5" stroke-dasharray="22 8 4 8"/>
      <path d="M${cx+160} ${cy-132}H${cx+250}M${cx+160} ${cy+132}H${cx+250}M${cx+232} ${cy-132}V${cy+132}" stroke="var(--pink)" stroke-width="3" fill="none"/>
    </svg>`;
  },
  // Sandbox: a shelf of named computers.
  sandbox: () => {
    const pc=(x,name,kind,c)=>`<rect x="${x}" y="70" width="228" height="164" rx="16" fill="var(--card)" stroke="var(--line)" stroke-width="2.5"/><text x="${x+24}" y="132" font-size="38" font-family="Geist Mono" font-weight="600" fill="${c}">&gt;_</text><rect x="${x+24}" y="158" width="150" height="9" rx="4" fill="var(--line)"/><rect x="${x+24}" y="182" width="98" height="9" rx="4" fill="var(--line)"/><path d="M${x+88} 234v28m52-28v28M${x+66} 264h96" stroke="var(--line)" stroke-width="7" stroke-linecap="round"/><text x="${x+114}" y="312" text-anchor="middle" font-size="27" font-family="Geist Mono" fill="var(--ink)">${name}</text><text x="${x+114}" y="348" text-anchor="middle" font-size="24" fill="${c}">${kind}</text>`;
    return `<svg viewBox="0 0 840 378" preserveAspectRatio="xMidYMid slice">${pc(36,'workstation','permanent','var(--violet)')}${pc(306,'tester','temporary','var(--cyan)')}${pc(576,'builder','temporary','var(--cyan)')}</svg>`;
  },
  // Video: a timeline with clips on tracks.
  video: () => {
    const clip=(x,y,w,c)=>`<rect x="${x}" y="${y}" width="${w}" height="66" rx="12" fill="color-mix(in srgb, ${c} 34%, transparent)" stroke="${c}" stroke-width="3"/>`;
    let ticks=''; for(let x=60;x<=800;x+=37) ticks+=`<path d="M${x} 36v${(x-60)%185===0?26:14}" stroke="var(--faint)" stroke-width="2.5"/>`;
    return `<svg viewBox="0 0 840 378" preserveAspectRatio="xMidYMid slice">${ticks}
      ${clip(60,84,250,'var(--violet)')}${clip(322,84,180,'var(--cyan)')}${clip(514,84,266,'var(--violet)')}
      ${clip(140,170,300,'var(--pink)')}${clip(452,170,200,'var(--amber)')}
      ${clip(60,256,720,'var(--green)')}
      <path d="M430 28V336" stroke="var(--ink)" stroke-width="4"/><path d="M414 20h32v18l-16 16-16-16Z" fill="var(--ink)"/>
    </svg>`;
  },
  // ABAP: a short piece of the language, set like code.
  abap: () => {
    const kw='var(--violet)', tx='var(--ink)', st='var(--green)';
    const L=[[['REPORT ',kw],['z_hello.',tx]],[],[['DATA ',kw],['greeting ',tx],['TYPE ',kw],['string.',tx]],[['greeting = ',tx],["`Hello, agent`",st],['.',tx]],[['WRITE ',kw],['greeting.',tx]]];
    return `<svg viewBox="0 0 840 378" preserveAspectRatio="xMidYMid slice">${L.map((row,i)=>`<text x="44" y="${84+i*62}" font-size="40" font-family="Geist Mono"><tspan fill="var(--faint)">${i+1}  </tspan>${row.map(([t,c])=>`<tspan fill="${c}" xml:space="preserve">${t}</tspan>`).join('')}</text>`).join('')}</svg>`;
  },
  // SAP GUI: a form with a cursor filling it in.
  sapgui: () => {
    const f=(y,w,fill)=>`<rect x="86" y="${y+8}" width="150" height="16" rx="8" fill="var(--faint)" opacity=".7"/><rect x="266" y="${y}" width="${w}" height="44" rx="6" fill="${fill?'color-mix(in srgb, var(--violet) 18%, var(--card))':'var(--card)'}" stroke="${fill?'var(--violet)':'var(--line)'}" stroke-width="3"/>`;
    return `<svg viewBox="0 0 840 378" preserveAspectRatio="xMidYMid slice">
      <rect x="44" y="30" width="752" height="318" rx="14" fill="var(--bg)" stroke="var(--line)" stroke-width="2.5"/><path d="M44 96H796" stroke="var(--line)" stroke-width="2.5"/>
      <rect x="72" y="50" width="200" height="26" rx="6" fill="var(--violet)" opacity=".85"/><rect x="290" y="50" width="96" height="26" rx="6" fill="var(--line)"/><rect x="400" y="50" width="96" height="26" rx="6" fill="var(--line)"/>
      ${f(124,300,true)}${f(188,430,false)}${f(252,220,false)}
      <path d="M520 138l0 92 24-22 18 42 22-10-18-41 33-3Z" fill="var(--ink)" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round"/>
    </svg>`;
  },
  // Windows automation: overlapping app windows and a click.
  windows: () => {
    const w=(x,y,ww,hh,c)=>`<rect x="${x}" y="${y}" width="${ww}" height="${hh}" rx="12" fill="var(--card)" stroke="var(--line)" stroke-width="2.5"/><rect x="${x}" y="${y}" width="${ww}" height="46" rx="12" fill="${c}" opacity=".85"/><rect x="${x+ww-40}" y="${y+15}" width="20" height="16" rx="3" fill="#fff" opacity=".85"/>`;
    return `<svg viewBox="0 0 840 378" preserveAspectRatio="xMidYMid slice">${w(70,44,460,250,'var(--faint)')}${w(290,104,480,244,'var(--violet)')}
      <rect x="330" y="182" width="290" height="16" rx="8" fill="var(--line)"/><rect x="330" y="216" width="210" height="16" rx="8" fill="var(--line)"/>
      <rect x="560" y="268" width="172" height="56" rx="10" fill="var(--cyan)"/>
      <circle cx="646" cy="296" r="58" fill="none" stroke="var(--cyan)" stroke-width="4" opacity=".6"/><circle cx="646" cy="296" r="88" fill="none" stroke="var(--cyan)" stroke-width="3" opacity=".3"/>
      <path d="M640 290l0 74 20-18 15 34 18-8-15-33 27-3Z" fill="var(--ink)" stroke="var(--bg)" stroke-width="5" stroke-linejoin="round"/>
    </svg>`;
  },
};

const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const picture = p => p.art ? ART[p.art]() : `<img src="../assets/shots/${p.shot}" style="object-position:${p.pos||'50% 50%'};${p.zoom?`transform:scale(${p.zoom});transform-origin:${p.pos}`:''}">`;

window.render = async s => {
  const stage = document.getElementById('stage');
  const t = `t ${s.theme}`;
  if (s.kind === 'header') {
    stage.innerHTML = `<div class="${t} header"><div class="glow"></div><div class="copy"><h1>${esc(s.h.name)}</h1><div class="big">${esc(s.h.line)}</div><div class="sub">${esc(s.h.sub)}</div></div>${graph(s.h.graph)}</div>`;
  } else if (s.kind === 'section') {
    stage.innerHTML = `<div class="${t} section"><div class="node">${s.num}</div><h2>${esc(s.title)}</h2><div class="say">${esc(s.line)}</div><div class="wire"></div></div>`;
  } else if (s.kind === 'wide') {
    const p = s.p;
    stage.innerHTML = `<div class="${t} wide"><img src="../assets/shots/${p.shot}" style="object-position:${p.pos}"><div class="shade"></div><div class="text"><h3>${esc(p.name)}</h3><p>${esc(p.line)}</p><small>${esc(p.note||'')}</small></div></div>`;
  } else {
    const p = s.p;
    const fit = s.kind === 'tall' && p.name.length > 14 ? ' style="font-size:64px"' : '';
    stage.innerHTML = `<div class="${t} card ${s.kind}"><div class="pic">${picture(p)}</div><div class="foot"><div class="name"${fit}><span class="dot"></span>${esc(p.name)}</div><div class="line">${esc(p.line)}</div></div></div>`;
  }
  await Promise.all([...stage.querySelectorAll('img')].map(i => i.decode()));
  await document.fonts.ready;
};

// Screenshots come back as PNG. Re-encode in the page to keep the repo small.
window.toWebp = async b64 => {
  const img = new Image(); img.src = 'data:image/png;base64,' + b64; await img.decode();
  const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
  c.getContext('2d').drawImage(img, 0, 0);
  return c.toDataURL('image/webp', 0.88).split(',')[1];
};
window.ready = true;
</script>
